_min_copier_version: "9.0.0"
_subdirectory: template

project_name:
  type: str
  help: Cargo package name (lowercase letters, digits, hyphens and underscores)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9_-]*$')) %}
    Must start with a lowercase letter and contain only lowercase letters, digits, hyphens and underscores
    {% endif %}

crate_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false

description:
  type: str
  help: Short description of the project
  default: ""

author_name:
  type: str
  help: Name used in the LICENSE copyright line

copyright_year:
  type: str
  help: Year used in the LICENSE copyright line
