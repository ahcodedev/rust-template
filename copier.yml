_min_copier_version: "9.6.0"
_subdirectory: template

# Starter code is only created by `copier copy`. `copier update` skips these files, so a project
# can change, move or delete them without an update recreating or overwriting them.
# (`_copier_operation` needs Copier 9.6.0 or later.)
_exclude:
  - "{% if _copier_operation == 'update' %}src/lib.rs{% endif %}"
  - "{% if _copier_operation == 'update' %}src/main.rs{% endif %}"
  - "{% if _copier_operation == 'update' %}tests/greeting.rs{% endif %}"

project_name:
  type: str
  help: Cargo package name (lowercase letters, digits, hyphens and underscores)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9_-]*$')) %}
    Must start with a lowercase letter and contain only lowercase letters, digits, hyphens and underscores
    {% endif %}

crate_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false

description:
  type: str
  help: Short description of the project
  default: ""

copyright_year:
  type: str
  help: Year used in the LICENSE copyright line
