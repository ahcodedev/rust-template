# Dependabot version updates; patch and minor updates are auto-merged by dependabot-auto-merge.yml
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release, so broken or malicious versions are more likely to be caught first
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release, so broken or malicious versions are more likely to be caught first
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"
