# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/). Run with: just deny

[graph]
all-features = true

# Fail on crates with security advisories, or that are unmaintained or yanked
[advisories]
ignore = []

# Only allow common permissive licenses; add others here as dependencies need them
[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# Don't warn about licenses in the list that no current dependency uses
unused-allowed-license = "allow"

# Warn when several versions of the same crate are in the dependency tree
[bans]
multiple-versions = "warn"
wildcards = "deny"

# Only allow crates from crates.io
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
