name: Dependabot auto-merge

# pull_request (not pull_request_target) is enough: Dependabot PRs come from a branch in this
# repository, so the token gets the permissions granted below
on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Check the PR author rather than github.actor, which can be someone re-running the workflow
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Patch and minor updates merge once the required checks pass; major updates wait for review.
      # Auto-merge must be allowed in the repository settings, with required status checks on main.
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
